</style><h1>QuotaBar · 额度看板</h1><p>在菜单栏查看 Codex、智谱 Coding Plan 和 Kimi Code 的剩余额度，以及本机每日 token 用量。</p><p>支持 macOS 13 及以上，兼容 Intel 和 Apple Silicon。</p><p>将安装到：<b>/Applications/额度看板.app</b></p><p>升级前，请通过菜单栏图标的右键菜单退出旧版额度看板。安装将保留原有账号连接、设置和本机用量汇总。</p><p>安装包仅包含应用程序，不包含账号、密钥或个人用量数据。</p></html>
