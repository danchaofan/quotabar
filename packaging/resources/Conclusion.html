</style><h1>安装完成</h1><p>请在“应用程序”中打开<b>额度看板</b>。</p><p>启动后，点击屏幕顶部菜单栏的柱状图图标即可查看额度和用量。应用不显示 Dock 图标。</p><p>首次使用需要在本机登录相应的 Codex CLI、ZCode 或 Kimi Code。可在设置中查看连接情况并启用开机启动。</p></html>
